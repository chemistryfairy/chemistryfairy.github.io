<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬기로운 지선티의 학교생활 아카이빙</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{
    --bg:#fffaf2; --ink:#2d2a3e; --muted:#7b7690; --line:#efe7da;
    --c1:#16a085; --c1s:#d9f5ee;   /* 수업자료 */
    --c2:#ff6b6b; --c2s:#ffe3e3;   /* 수업영상 */
    --c3:#4c7dff; --c3s:#e0e9ff;   /* 학급운영 */
    --c4:#a267e8; --c4s:#efe3fc;   /* 기타 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* ---------- 상단 히어로 ---------- */
  header{position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(135deg,#6a5cff 0%,#a267e8 45%,#ff7eb3 100%);
    padding:72px 0 96px}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:60px;
    background:var(--bg);clip-path:ellipse(70% 100% at 50% 100%)}
  .hero{position:relative;z-index:2}
  .badge{display:inline-block;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);
    padding:4px 14px;border-radius:999px;font-size:14px;font-weight:600;backdrop-filter:blur(4px)}
  h1{font-family:Jua,Pretendard,sans-serif;font-weight:400;font-size:clamp(32px,6vw,56px);
    line-height:1.25;margin:16px 0 12px;letter-spacing:-.01em;text-shadow:0 3px 0 rgba(0,0,0,.08)}
  h1 .hl{background:linear-gradient(transparent 62%,rgba(255,230,109,.75) 62%);padding:0 4px}
  .intro{font-size:17px;opacity:.95}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
  .stat{background:#fff;color:var(--ink);border-radius:16px;padding:10px 16px;
    display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(60,20,120,.18);font-weight:600}
  .stat b{font-size:20px}
  .stat .em{font-size:20px}

  /* 떠다니는 과학 아이콘 */
  .float{position:absolute;font-size:42px;opacity:.9;z-index:1;animation:bob 6s ease-in-out infinite;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
  .f1{right:8%;top:22%}
  .f2{right:22%;top:58%;font-size:34px;animation-delay:-2s}
  .f3{right:4%;top:66%;font-size:30px;animation-delay:-4s}
  .f4{right:30%;top:16%;font-size:28px;animation-delay:-1s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(6deg)}}
  @media (max-width:700px){.float{opacity:.35}}

  /* ---------- 탭 ---------- */
  nav{position:sticky;top:0;z-index:5;background:rgba(255,250,242,.9);backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;align-items:center}
  nav button{font:inherit;font-size:15px;font-weight:600;border:2px solid var(--line);background:#fff;
      border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap;color:var(--ink);transition:.15s}
  nav button:hover{transform:translateY(-1px)}
  nav button.on{color:#fff;border-color:transparent;background:var(--tab,#2d2a3e)}
  .search{margin-left:auto;min-width:180px;font:inherit;font-size:15px;border:2px solid var(--line);
      border-radius:999px;padding:6px 14px;background:#fff;outline:none}
  .search:focus{border-color:#a267e8}

  /* ---------- 섹션 & 카드 ---------- */
  section{padding:40px 0 8px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .sec-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px}
  .sec-head h2{font-family:Jua,Pretendard,sans-serif;font-weight:400;font-size:28px}
  .sec-head .count{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px 20px 18px;
      display:flex;flex-direction:column;gap:8px;transition:transform .18s,box-shadow .18s,border-color .18s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--cc)}
  .card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 12px 26px rgba(80,40,140,.12);border-color:var(--cc)}
  .card .emoji{font-size:30px;line-height:1}
  .card h3{font-size:17px;font-weight:800;line-height:1.4}
  .card p{font-size:14px;color:var(--muted)}
  .card .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .card .go{font-weight:700;color:var(--cc)}
  .empty{color:var(--muted);font-size:15px;padding:22px;border:2px dashed var(--line);border-radius:20px;text-align:center;background:#fff}

  footer{margin-top:64px;padding:32px 0 48px;text-align:center;color:var(--muted);font-size:14px}
  footer .heart{color:#ff6b6b}
</style>
</head>
<body>

<header>
  <span class="float f1">🧪</span>
  <span class="float f2">🪐</span>
  <span class="float f3">⚛️</span>
  <span class="float f4">✨</span>
  <div class="wrap hero">
    <span class="badge">🍎 Classroom Archive</span>
    <h1>슬기로운 <span class="hl">지선티</span>의<br>학교생활 아카이빙</h1>
    <p class="intro">수업자료, 수업영상, 학급운영 기록을 차곡차곡 모아 두는 곳이에요.</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<nav>
  <div class="wrap" id="tabs">
    <input class="search" id="q" type="search" placeholder="🔍 자료 검색">
  </div>
</nav>

<main class="wrap" id="main"></main>

<footer>
  만든 사람 지선티 <span class="heart">♥</span> © <span id="yr"></span> 슬기로운 지선티의 학교생활 아카이빙
</footer>

<script>
/* =========================================================
   ✏️ 여기만 고치면 됩니다!
   ---------------------------------------------------------
   자료를 추가하려면 아래 items 목록에 { ... }, 한 덩어리를 복사해서 붙여 넣고
   내용을 바꾸세요. (각 덩어리 끝의 쉼표 , 를 꼭 남겨 두세요)

   category : "수업자료" / "수업영상" / "학급운영" / "기타" 중 하나
   title    : 제목
   desc     : 한 줄 설명 (없으면 "" 로 비워 두기)
   date     : 날짜 (예: "2026-11")
   link     : 자료 주소 (구글드라이브, 유튜브 등). 없으면 ""
   emoji    : (선택) 카드에 띄울 이모지. 없으면 카테고리 기본 이모지
   ========================================================= */
const items = [
  {
    category: "수업자료",
    title: "예시) 운동과 에너지 활동지",
    desc: "자료를 올리면 이 예시 카드를 지우거나 바꿔 주세요.",
    date: "2026-11",
    link: "",
    emoji: "⚡"
  },
  {
    category: "수업영상",
    title: "예시) 실험 시연 영상",
    desc: "유튜브 링크를 link 칸에 넣으면 카드를 눌렀을 때 바로 열려요.",
    date: "2026-11",
    link: "",
    emoji: "🔬"
  },
  {
    category: "학급운영",
    title: "예시) 학급 규칙 & 1인 1역",
    desc: "학급운영 기록을 모아 보세요.",
    date: "2026-11",
    link: "",
    emoji: "🏫"
  },
];

/* ---------- 아래는 건드리지 않아도 됩니다 ---------- */
const cats = [
  {name:"수업자료", icon:"📚", color:"var(--c1)", soft:"var(--c1s)"},
  {name:"수업영상", icon:"🎬", color:"var(--c2)", soft:"var(--c2s)"},
  {name:"학급운영", icon:"🌱", color:"var(--c3)", soft:"var(--c3s)"},
  {name:"기타",     icon:"🎒", color:"var(--c4)", soft:"var(--c4s)"},
];
let current = "전체";
const tabs = document.getElementById("tabs"), q = document.getElementById("q"), main = document.getElementById("main");

document.getElementById("stats").innerHTML = cats.slice(0,3).map(c=>
  `<div class="stat"><span class="em">${c.icon}</span>${c.name} <b style="color:${c.color}">${items.filter(i=>i.category===c.name).length}</b></div>`).join("");

[{name:"전체",icon:"🌈",color:"#2d2a3e"}, ...cats].forEach(c=>{
  const b = document.createElement("button");
  b.textContent = c.icon+" "+c.name; b.style.setProperty("--tab", c.color);
  if(c.name===current) b.className="on";
  b.onclick = ()=>{ current=c.name; [...tabs.querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b)); render(); };
  tabs.insertBefore(b, q);
});
q.addEventListener("input", render);

function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const term = q.value.trim().toLowerCase();
  main.innerHTML = "";
  cats.filter(c=>current==="전체"||current===c.name).forEach(c=>{
    const list = items.filter(i=>i.category===c.name &&
      (!term || (i.title+" "+i.desc).toLowerCase().includes(term)))
      .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    if(current==="전체" && c.name==="기타" && !list.length) return;
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="sec-head"><span class="sec-icon" style="background:${c.soft}">${c.icon}</span>
      <h2>${c.name}</h2><span class="count" style="background:${c.soft};color:${c.color}">${list.length}개</span></div>`;
    const grid = document.createElement("div"); grid.className="grid";
    if(!list.length) grid.innerHTML = `<div class="empty">아직 자료가 없어요. 곧 채워질 거예요 ✨</div>`;
    list.forEach(i=>{
      const el = document.createElement(i.link ? "a" : "div");
      el.className = "card"; el.style.setProperty("--cc", c.color);
      if(i.link){ el.href=i.link; el.target="_blank"; el.rel="noopener"; }
      el.innerHTML = `<span class="emoji">${esc(i.emoji||c.icon)}</span>
        <h3>${esc(i.title)}</h3>${i.desc?`<p>${esc(i.desc)}</p>`:""}
        <div class="meta"><span>${esc(i.date)}</span>${i.link?`<span class="go">열기 →</span>`:""}</div>`;
      grid.appendChild(el);
    });
    sec.appendChild(grid); main.appendChild(sec);
  });
}
document.getElementById("yr").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
